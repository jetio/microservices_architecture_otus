version: '3.7'

services:
  prj-auth:
    image: prj-auth:latest
    ports:
      - 8085:8085

  prj-order:
    depends_on:
      - rabbitmq
    image: prj-order:latest
    ports:
      - 8081:8081

  prj-security:
    image: prj-security:latest
    ports:
      - 8082:8082

  prj-user:
    image: prj-user:latest
    ports:
      - 8083:8083

  prj-trade:
    depends_on:
      - rabbitmq
    image: prj-trade:latest
    ports:
      - 8084:8084

  prj-gw:
    image: prj-gw:latest
    ports:
      - 8086:8086

  traefik:
    image: traefik:v2.5
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik.yml:/etc/traefik/traefik.yml
      - ./config/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml
    command: --api.insecure=true --providers.file.filename=/etc/traefik/dynamic_conf.yml

  rabbitmq:
    image: rabbitmq:3.10.7-management
    ports:
      - 15672:15672
      - 5672:5672

  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:main
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

