server:
  port: 8086

spring:
  cloud:
    gateway:
      routes:
        - id: securities-service
          uri: http://host.docker.internal:8082
          predicates:
            - Path=/api/v1/securities/**
        - id: users-service
          uri: http://host.docker.internal:8083
          predicates:
            - Path=/api/v1/users/**
        - id: trade-service
          uri: http://host.docker.internal:8084
          predicates:
            - Path=/api/v1/trading/**