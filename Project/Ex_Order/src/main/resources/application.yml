server:
  port: 8081

spring:
  rabbitmq:
    host: host.docker.internal
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:h2:mem:exordersdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

mq:
  sell:
    queue: /queue/trade/inbound/order/sell
  buy:
    queue: /queue/trade/inbound/order/buy

management:
  security:
    enabled: false
  health:
    livenessstate:
      enabled: true
    readynessstate:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health, metrics, prometheus"