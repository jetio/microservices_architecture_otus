server:
  port: 8084

spring:
  rabbitmq:
    host: host.docker.internal
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:h2:mem:tradedb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

mq:
  sell:
    queue: /queue/trade/inbound/order/sell
  buy:
    queue: /queue/trade/inbound/order/buy
  security:
    queue: /queue/trade/inbound/security
  user:
    queue: /queue/trade/inbound/user